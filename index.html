<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ticket!</h1>
    <div class="main-left">
        <div><h2>Call information:</h2></div>
        <div class="info"><label for="name">Customer's Name:</label> <input type="text" class="lightbg darktext" id="name"></div>
        <div class="info"><label for="phonenum">Phone Number:</label> <input type="number" class="lightbg darktext" id="phonenum"></div>
        <div class="info"><label for="email">Email Address:</label> <input type="email" class="lightbg darktext" id="email"></div>
        <div class="info"><label for="ordernum">Order Number:</label> <input type="text" class="lightbg darktext" id="ordernum"></div>
        <div class="info"><label for="equipmodel">Equipment Model:</label> <input type="text" class="lightbg darktext" id="equipmodel"></div>
        <div class="info"><label for="serialnum">Serial Number:</label> <input type="text" class="lightbg darktext" id="serialnum"></div>
        <div class="info"><label for="purchasedate">Date of Purchase:</label> <input type="date" class="lightbg darktext" id="purchasedate"> | <input type="text" class="lightbg darktext" id="purchasedateText"></div>
        <div class="info"><label for="purchaseplace">Place of Purchase:</label> <input type="text" class="lightbg darktext" id="purchaseplace"></div>
        <div class="info"><label for="call-reason">Reason for calling:</label> <textarea class="lightbg darktext" id="call-reason"></textarea></div>
        <div class="info"><label for="call-resolution">Resolution:</label> <textarea class="lightbg darktext" id="call-resolution"></textarea></div>
    </div>
</body>
</html>
