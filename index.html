<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
<div class="main">
    <div class="main-left">
        <div><h2>Call information:</h2></div>
        <div class="info"><label for="name">Customer's Name:</label> <input type="text" class="lightbg darktext" id="name"></div>
        <div class="info"><label for="phonenum">Phone Number:</label> <input type="tel" class="lightbg darktext" id="phonenum"></div>
        <div class="info"><label for="email">Email Address:</label> <input type="email" class="lightbg darktext" id="email"></div>
        <div class="info"><label for="ordernum">Order Number:</label> <input type="text" class="lightbg darktext" id="ordernum"></div>
        <div class="info"><label for="equipmodel">Equipment Model:</label> <input type="text" class="lightbg darktext" id="equipmodel"></div>
        <div class="info"><label for="serialnum">Serial Number:</label> <input type="text" class="lightbg darktext" id="serialnum"></div>
        <div class="info"><label for="purchasedate">Date of Purchase:</label> <input type="date" class="lightbg darktext" id="purchasedate"> | <input type="text" class="lightbg darktext" id="purchasedateText"></div>
        <div class="info"><label for="purchaseplace">Place of Purchase:</label> <input type="text" class="lightbg darktext" id="purchaseplace"></div>
        <div class="info align-top"><label for="call-reason">Reason for calling:</label> <textarea class="lightbg darktext" id="call-reason"></textarea></div>
        <div class="info"><label for="call-resolution">Resolution:</label> <textarea class="lightbg darktext" id="call-resolution"></textarea></div>
        
        <hr />
        <!--Equipment Support Section-->
        <h2>ES Info:</h2>
        <div class="info ec-section"><label for="PoP">PoP Requested?</label> <input type="text" class="lightbg darktext" id="PoP"></div>
        <div class="info ec-section align-top"><label for="address">Address of Machine:</label> <textarea class="lightbg darktext" id="address"></textarea></div>
        <div class="info ec-section"><label for="troubleshoot">Troubleshooting Done:</label> <input type="text" class="lightbg darktext" id="troubleshoot"></div>
        <div class="info ec-section"><label for="parts">Parts recommended?</label> <input type="text" class="lightbg darktext" id="parts"></div>
        <div class="info ec-section"><label for="issueMedia">Photo/Vid of issue:</label> <input type="text" class="lightbg darktext" id="issueMedia"></div>



        <!--Button-->
        <div class="buttons">
            <div><button onclick="generateGeneral()" class="button" id="btn-general">General</button></div>
            <div><button onclick="generateEquipment()"  class="button" id="btn-equipment">Equipment</button></div>
        </div>
    </div>
        
        <!--Output section-->

    <div class="main-right">
        <h3></h3>
        <div><textarea id="output"></textarea></div>
        <div><button onclick="copyTicket()" class="button">Copy to Clipboard</button></div>
    </div>
</div>    



<script src="js/script.js"></script>
</body>
</html>
