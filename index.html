<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ticket!</h1>
    <div>
        <h2>Input</h2>
        <p>Name:</p> <input type="text">
        <p>Phone Number:</p> <input type="number">
        <p>Email Address:</p> <input type="email">
        <p>Order Number:</p> <input type="text">
        <p>Equipment Model:</p> <input type="text">
        <p>Serial Number:</p> <input type="text">
        <p>Date of Purchase:</p> <input type="date"> | <input type="text">
        <p>Place of Purchase:</p> <input type="text">
        <p>Reason for calling:</p> <textarea></textarea>
        <p>Resolution:</p> <textarea></textarea>
    </div>
</body>
</html>
